# Runs on every push and pull request: unit tests (Python + JavaScript), a
# real end-to-end smoke test against the demo database, touch tests in a real
# headless Chrome, and a Docker build. Keeps `main` honest.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Third-party credits are intact
        run: |
          grep -q "Copyright (c) 2017 Nolan Gilley" LICENSE-python-ecobee-api.txt
          grep -q "Nolan Gilley" LICENSE
          grep -q "github.com/nkgilley/python-ecobee-api" README.md

      - name: Byte-compile all sources
        run: python -m compileall -q app tools pyecobee tests

      - name: Python unit tests
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript unit tests
        run: node --test tests/js/*.test.js

      - name: Touch tests in headless Chrome (phone emulation)
        env:
          REQUIRE_BROWSER: "1"   # fail rather than skip if Chrome is missing
        run: node --test --test-timeout=60000 tests/browser/*.test.mjs

      - name: Generate the demo database
        run: python tools/make_demo_db.py --db /tmp/demo.sqlite3 --hours 6

      - name: Start the dashboard
        run: |
          python app/ecobee_dashboard.py --db /tmp/demo.sqlite3 --port 8321 --no-open &
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8321/ && break
            sleep 0.5
          done

      - name: Smoke-check the running dashboard
        run: python tools/smoke_check.py --base http://127.0.0.1:8321

      - name: Rename/reorder CLI works
        run: |
          python app/ecobee_units.py --db /tmp/demo.sqlite3 list
          python app/ecobee_units.py --db /tmp/demo.sqlite3 rename "Upstairs" "Guest Room"
          python app/ecobee_units.py --db /tmp/demo.sqlite3 list | grep -q "Guest Room"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t ecobee-trends:ci .

      - name: Image runs and shows help
        run: docker run --rm ecobee-trends:ci python app/ecobee_logger.py --help

      - name: Unit tests pass inside the image (its own Python and SQLite)
        run: docker run --rm -v "$PWD/tests:/srv/tests:ro" ecobee-trends:ci python -m unittest discover -s tests

      - name: Image carries the license notices
        run: |
          docker run --rm ecobee-trends:ci grep -q "Nolan Gilley" LICENSE
          docker run --rm ecobee-trends:ci grep -q "Copyright (c) 2017 Nolan Gilley" LICENSE-python-ecobee-api.txt
