# Runs on every push and pull request: unit tests (Python + JavaScript), a
# real end-to-end smoke test against the demo database, touch tests in a real
# headless Chrome, and a Docker build. Keeps `main` honest.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Third-party credits are intact
        run: |
          grep -q "Copyright (c) 2017 Nolan Gilley" LICENSE-python-ecobee-api.txt
          grep -q "Nolan Gilley" LICENSE
          grep -q "github.com/nkgilley/python-ecobee-api" README.md

      - name: Byte-compile all sources
        run: python -m compileall -q app tools pyecobee tests

      - name: Python unit tests
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript unit tests
        run: node --test tests/js/*.test.js

      - name: Touch tests in headless Chrome (phone emulation)
        env:
          REQUIRE_BROWSER: "1"   # fail rather than skip if Chrome is missing
        run: node --test --test-timeout=60000 tests/browser/*.test.mjs

      - name: Generate the demo database
        run: python tools/make_demo_db.py --db /tmp/demo.sqlite3 --hours 6

      - name: Start the dashboard
        run: |
          python app/ecobee_dashboard.py --db /tmp/demo.sqlite3 --port 8321 --no-open &
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8321/ && break
            sleep 0.5
          done

      - name: Smoke-check the running dashboard
        run: python tools/smoke_check.py --base http://127.0.0.1:8321

      - name: Rename/reorder CLI works
        run: |
          python app/ecobee_units.py --db /tmp/demo.sqlite3 list
          python app/ecobee_units.py --db /tmp/demo.sqlite3 rename "Upstairs" "Guest Room"
          python app/ecobee_units.py --db /tmp/demo.sqlite3 list | grep -q "Guest Room"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t ecobee-trends:ci .

      - name: Image runs and shows help
        run: docker run --rm ecobee-trends:ci python app/ecobee_logger.py --help

      - name: Unit tests pass inside the image (its own Python and SQLite)
        run: docker run --rm -v "$PWD/tests:/srv/tests:ro" ecobee-trends:ci python -m unittest discover -s tests

      - name: Compose setup works on Linux (host-owned data folders)
        # What setup.sh --demo does. On Linux, bind-mounted folders keep the
        # host's permissions, so the containers must run as the host user.
        run: |
          mkdir -p data/auth data/db && chmod 700 data/auth
          printf 'ECOBEE_UID=%s\nECOBEE_GID=%s\n' "$(id -u)" "$(id -g)" > .env
          docker compose build --quiet
          docker compose run --rm --no-deps -T logger python tools/make_demo_db.py --db /data/db/ecobee.sqlite3
          docker compose run --rm --no-deps -T logger sh -c 'echo "{}" > /data/auth/probe && rm /data/auth/probe'
          docker compose up -d dashboard
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8321/ && break; sleep 1; done
          python3 tools/smoke_check.py --base http://127.0.0.1:8321
          test "$(stat -c %u data/db/ecobee.sqlite3)" = "$(id -u)"
          docker compose down

      - name: Logger stops cleanly on docker stop (exit 0, not 137)
        # As PID 1 the logger must handle SIGTERM itself, or Docker waits out
        # the grace period and SIGKILLs it. A dummy token file makes it wait
        # for a new login instead of calling ecobee. Reuses the step above's
        # data folders and .env.
        run: |
          echo "not a token file" > data/auth/ecobee.conf
          docker compose up -d logger
          for _ in $(seq 1 30); do
            docker compose logs logger | grep -q "Waiting for a new token file" && break
            sleep 1
          done
          docker compose logs logger | grep -q "Waiting for a new token file"
          docker compose stop -t 5 logger
          docker compose logs logger
          test "$(docker inspect -f '{{.State.ExitCode}}' ecobee-logger)" = 0
          docker compose logs logger | grep -q "Stopped by SIGTERM"
          docker compose down

      - name: Image carries the license notices
        run: |
          docker run --rm ecobee-trends:ci grep -q "Nolan Gilley" LICENSE
          docker run --rm ecobee-trends:ci grep -q "Copyright (c) 2017 Nolan Gilley" LICENSE-python-ecobee-api.txt
