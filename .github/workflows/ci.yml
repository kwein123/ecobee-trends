# Runs on every push and pull request: syntax check, a real end-to-end smoke
# test against the demo database, and a Docker build. Keeps `main` honest.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile all sources
        run: python -m compileall -q app tools pyecobee

      - name: Generate the demo database
        run: python tools/make_demo_db.py --db /tmp/demo.sqlite3 --hours 6

      - name: Serve it and check the endpoints
        run: |
          python app/ecobee_dashboard.py --db /tmp/demo.sqlite3 --port 8321 --no-open &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8321/ && break
            sleep 0.5
          done

          echo "--- page loads"
          curl -sf http://127.0.0.1:8321/ | grep -q "Ecobee Trends"

          echo "--- stylesheet loads"
          curl -sf -o /dev/null http://127.0.0.1:8321/static/theme.css

          echo "--- API returns the demo thermostats"
          curl -sf "http://127.0.0.1:8321/api/data?hours=6" \
            | python -c "
import json, sys
d = json.load(sys.stdin)
names = sorted(t['display_name'] for t in d['thermostats'])
assert names == ['Lake House', 'Main Floor', 'Upstairs'], names
assert all(t['ts'] for t in d['thermostats']), 'no readings'
print('ok:', names)
"

          echo "--- serial numbers are not exposed"
          if curl -sf "http://127.0.0.1:8321/api/data?hours=6" | grep -qE '10000000000[0-9]'; then
            echo 'FAIL: raw identifier found in API response'; exit 1
          fi

      - name: Rename/reorder CLI works
        run: |
          python app/ecobee_units.py --db /tmp/demo.sqlite3 list
          python app/ecobee_units.py --db /tmp/demo.sqlite3 rename "Upstairs" "Guest Room"
          python app/ecobee_units.py --db /tmp/demo.sqlite3 list | grep -q "Guest Room"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t ecobee-trends:ci .
      - name: Image runs and shows help
        run: docker run --rm ecobee-trends:ci python app/ecobee_logger.py --help
