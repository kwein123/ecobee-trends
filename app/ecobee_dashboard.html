<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ecobee Trends</title>
<link rel="stylesheet" href="static/theme.css">
<!-- site:head -->
<link rel="stylesheet" href="static/dashboard.css">
<script src="static/dashboard-core.js" defer></script>
<script src="static/dashboard.js" defer></script>
</head>
<body>
<!-- Site chrome. To brand it for your own site without editing this file,
     see "Hosting it under your own site" in the README (--site-dir). -->
<!-- site:header -->
<header class="sb-site">
  <div class="sb-site-inner">
    <a class="sb-brand" href="">Ecobee<span class="sb-dot">·</span>Trends</a>
    <nav class="sb-nav">
      <a href="https://github.com/kwein123/ecobee-trends">Project&nbsp;docs</a>
    </nav>
  </div>
</header>
<!-- /site:header -->
<div class="wrap">
  <header class="top">
    <h1>Ecobee Trends</h1>
    <span class="sub" id="status" role="status">loading…</span>
    <a class="guide-link" href="https://github.com/kwein123/ecobee-trends/blob/main/docs/user-guide.md">How to read this page</a>
  </header>
  <div class="filters">
    <div class="seg" id="rangeSeg" role="group" aria-label="Time range"></div>
    <button class="btn" id="refreshBtn" type="button">Refresh</button>
  </div>
  <p id="reorderHelp" class="sr-only">Drag a panel by the dotted handle to reorder the thermostats, or focus the handle and press the up or down arrow key. The order is remembered in this browser.</p>
  <main id="panels" aria-label="Thermostats"></main>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <noscript><p class="empty">This dashboard needs JavaScript to draw its charts.</p></noscript>
</div>
</body>
</html>
