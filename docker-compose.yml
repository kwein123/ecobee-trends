# Ecobee Trends — logger + dashboard.
#
#   ./setup.sh          first-time setup (login, then starts both services)
#   docker compose up -d        start
#   docker compose logs -f logger
#   docker compose down         stop
#
# Data lives in ./data on the host:
#   data/auth/ecobee.conf    OAuth tokens — mounted ONLY into the logger
#   data/db/ecobee.sqlite3   readings — the dashboard opens this read-only
# Keeping the token file out of the web-facing container means a compromise
# there cannot reach your ecobee credentials.

name: ecobee-trends

# Both containers run as the user that owns ./data on the host (setup.sh
# records it in .env), so they can write there on Linux, where the host's
# file permissions apply inside the container as-is.
x-run-as: &run-as "${ECOBEE_UID:-10001}:${ECOBEE_GID:-10001}"

services:
  logger:
    build: .
    image: ${ECOBEE_IMAGE:-ecobee-trends:local}
    container_name: ecobee-logger
    user: *run-as
    # On `docker compose stop` the logger finishes the poll in progress, and
    # an ecobee request can take up to 30 s on a slow network. Docker's
    # default 10 s would force-kill it first.
    stop_grace_period: 40s
    command: >
      python app/ecobee_logger.py
      --interval ${POLL_INTERVAL:-300}
    environment:
      # Default paths for every script in the image, so one-off commands like
      # `docker compose exec logger python app/ecobee_units.py list` just work.
      ECOBEE_CONFIG: /data/auth/ecobee.conf
      ECOBEE_DB: /data/db/ecobee.sqlite3
    volumes:
      - ./data/auth:/data/auth
      - ./data/db:/data/db
    restart: unless-stopped

  dashboard:
    build: .
    image: ${ECOBEE_IMAGE:-ecobee-trends:local}
    container_name: ecobee-dashboard
    user: *run-as
    # Deliberately no depends_on: the dashboard just reads the database file,
    # so it can run without the logger (that's what --demo mode uses) and an
    # unhealthy logger never takes the page down with it.
    command: >
      python app/ecobee_dashboard.py
      --host 0.0.0.0
      --port 8321
      --no-open
    environment:
      ECOBEE_DB: /data/db/ecobee.sqlite3
      # To brand the page for your own site, uncomment this and the volume
      # below, and put head.html / header.html / images in ./site
      # (README: "Hosting it under your own site").
      # ECOBEE_SITE_DIR: /site
    volumes:
      - ./data/db:/data/db          # database only — no access to the tokens
      # - ./site:/site:ro
    ports:
      - "${DASHBOARD_PORT:-8321}:8321"
    restart: unless-stopped
